# Server block for the Fullstack Loop Angular bundle.
#
# Installed as /etc/nginx/templates/default.conf.template in
# nginxinc/nginx-unprivileged:1.27-alpine, whose entrypoint renders it to
# /etc/nginx/conf.d/default.conf with envsubst. Only variables that exist in
# the environment are substituted, so nginx's own $uri/$host/... survive.
#
# Substituted at CONTAINER START (never at build time):
#   ${FULLSTACK_LOOP_FRONTEND_TOKEN}   the bearer token handed to the browser via /config.json
#   ${FULLSTACK_LOOP_API_BASE_PATH}    base path for the generated client ("" = same origin)
#   ${NGINX_LOCAL_RESOLVERS} nameservers from /etc/resolv.conf, filled in by the
#                            base image's 15-local-resolvers.envsh
#
# The upstream is reached through a *variable* proxy_pass plus a resolver so
# that nginx does not refuse to start when the `backend` container is not up
# yet (nginx resolves literal upstream hostnames once, at config load).
#
# The image already runs as the unprivileged `nginx` user and keeps its pid and
# temp paths under /tmp, so nothing here needs root.

resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness probe (DOCKER-CONVENTIONS.md: frontend GET /healthz).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Runtime configuration for the SPA.
    #
    # AUTH.md: "The dev token is supplied at runtime, never baked into the
    # image." The bundle is a static artefact built once; this endpoint is
    # rendered from the environment when the container starts, so the same
    # image can be run with a different token — or with none, in which case the
    # app loads unauthenticated and the API's 401 drives the UI.
    #
    # Never cached, and deliberately not proxied to the backend.
    location = /config.json {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"apiBasePath":"${FULLSTACK_LOOP_API_BASE_PATH}","token":"${FULLSTACK_LOOP_FRONTEND_TOKEN}"}';
    }

    # The API lives in the backend container; same-origin from the browser's
    # point of view, so the generated client uses an empty base path.
    location /api/ {
        set $backend_origin "${BACKEND_ORIGIN}";
        proxy_pass         $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Hashed build artefacts are immutable.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: deep links such as /tasks must serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
